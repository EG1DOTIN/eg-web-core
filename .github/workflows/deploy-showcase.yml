name: Deploy EG-Web-Core Showcase to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Quality Verification Suite
        run: python3 automation-scripts/run_all_checks.py

      - name: Build Showcase Web Portal (dist-site)
        run: npm run build:site

      - name: Deploy to Firebase Hosting (web-core.eg1.in)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EG_WEB_CORE }}
          channelId: live
          projectId: eg-web-core
